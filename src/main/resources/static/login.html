<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F172A">
    <title>Login | LMS</title>

    <!-- Fonts (Inter is also imported in theme.css; preconnect speeds it up) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom Theme -->
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="login-body">

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100 py-4">
            <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">

                <div class="card login-card shadow-lg border-0">
                    <div class="card-body p-4 p-sm-5">

                        <div class="text-center mb-4">
                            <div class="logo-circle mb-3">
                                <i class="bi bi-bank2 text-white fs-2"></i>
                            </div>
                            <h4 class="fw-bold mb-1">Welcome Back</h4>
                            <p class="text-muted small mb-0">Sign in to Loan Management System</p>
                        </div>

                        <!-- Error Alert -->
                        <div id="loginError" class="alert alert-danger d-none py-2 small" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label" for="username">Username or Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="username" required
                                           placeholder="Enter username" autocomplete="username">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="password">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" required
                                           placeholder="Enter password" autocomplete="current-password">
                                    <button type="button" class="btn btn-light border" id="togglePassword"
                                            aria-label="Show password" tabindex="-1">
                                        <i class="bi bi-eye" id="togglePasswordIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="loginBtn">
                                Sign In
                            </button>
                        </form>

                        <div class="text-center text-muted small mt-4 pt-3 border-top">
                            <i class="bi bi-shield-lock me-1"></i> Secure, encrypted sign-in
                        </div>

                    </div>
                </div>

                <p class="text-center text-white-50 small mt-4 mb-0">&copy; 2026 LMS. All rights reserved.</p>
            </div>
        </div>
    </div>

    <!-- jQuery & AJAX -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/auth.js"></script>

    <!-- UI-only: show/hide password (does not touch the login logic in auth.js) -->
    <script>
        (function () {
            var toggle = document.getElementById('togglePassword');
            var input = document.getElementById('password');
            var icon = document.getElementById('togglePasswordIcon');
            if (!toggle || !input || !icon) return;
            toggle.addEventListener('click', function () {
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
                toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            });
        })();
    </script>
</body>
</html>
