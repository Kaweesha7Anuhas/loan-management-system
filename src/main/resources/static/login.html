<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom Theme -->
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="login-body">

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card login-card shadow-lg border-0">
                    <div class="card-body p-5">
                        
                        <div class="text-center mb-4">
                            <div class="logo-circle mb-3">
                                <i class="bi bi-bank2 text-white fs-2"></i>
                            </div>
                            <h4 class="fw-bold text-dark">Welcome Back</h4>
                            <p class="text-muted small">Sign in to Loan Management System</p>
                        </div>

                        <!-- Error Alert -->
                        <div id="loginError" class="alert alert-danger d-none py-2 small" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">Username or Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" class="form-control border-start-0 bg-light" id="username" required placeholder="Enter username">
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label text-muted small fw-bold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" class="form-control border-start-0 bg-light" id="password" required placeholder="Enter password">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="loginBtn">
                                Sign In
                            </button>
                        </form>

                    </div>
                </div>
                <p class="text-center text-muted small mt-4">&copy; 2026 LMS. All rights reserved.</p>
            </div>
        </div>
    </div>

    <!-- jQuery & AJAX -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
